name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options: [Vue / Nuxt, React, Plain JS, Core only]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: '@risklight/modal, framework and browser versions'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or a link to a repository
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
